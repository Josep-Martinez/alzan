name: Sincronizar con AlzanHealth

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener main personal
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Actualizar desde AlzanHealth
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/AlzanHealth/alzan.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin HEAD:main
